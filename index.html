<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f5f5f5">
<title>同人跑攤手帳</title>
<style>
  :root{
    --paper:#f5f5f5;
    --paper-alt:#e8e8e6;
    --card:#ffffff;
    --ink:#141414;
    --ink-soft:#75746f;
    --line:#d6d5d0;
    --line-strong:#141414;
    --radius:14px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    overscroll-behavior:none;}
  body{
    background-image: radial-gradient(circle at 1px 1px, rgba(20,20,20,0.045) 1px, transparent 0);
    background-size: 14px 14px;
  }
  h1,h2,h3,.disp{font-weight:800; letter-spacing:.01em;}
  .mono{font-family:ui-monospace,"SF Mono","Roboto Mono","Courier New",monospace;}
  #app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;background:var(--paper);}

  header.topbar{
    padding:18px 18px 14px;
    border-bottom:2px solid var(--ink);
    position:sticky; top:0; z-index:20; background:var(--paper);
  }
  header.topbar .eyebrow{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.18em;color:var(--ink-soft);text-transform:uppercase;}
  header.topbar h1{font-size:22px;margin:2px 0 0;line-height:1.2;}
  header.topbar .sub{font-size:12px;color:var(--ink-soft);margin-top:4px;}

  main{flex:1; padding:16px 14px calc(96px + var(--safe-b)); overflow-y:auto;}

  nav.tabbar{
    position:fixed; left:0;right:0;bottom:0; max-width:560px; margin:0 auto;
    background:var(--ink); display:flex; z-index:30;
    padding-bottom:var(--safe-b);
    border-top:3px solid var(--ink);
  }
  nav.tabbar button{
    flex:1; background:none; border:none; color:#a8a7a2; padding:10px 4px 8px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:11px; position:relative; cursor:pointer;
  }
  nav.tabbar button .ic{font-size:18px; line-height:1;}
  nav.tabbar button.active{color:#fff;}
  nav.tabbar button.active::before{
    content:""; position:absolute; top:0; left:20%; right:20%; height:3px; background:#fff;
  }
  nav.tabbar button .badge-num{
    position:absolute; top:2px; right:22%; font-family:ui-monospace,monospace; font-size:9px; color:#8f8e89;
  }

  .tab-panel{display:none;}
  .tab-panel.active{display:block; animation:fadeIn .18s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  .btn{
    font-weight:700; font-size:14px; border-radius:999px; border:2px solid var(--ink);
    padding:9px 16px; background:var(--card); color:var(--ink); cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  }
  .btn.primary{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .btn.ghost{background:transparent; border-color:var(--line); color:var(--ink-soft); padding:6px 10px; font-size:12px;}
  .btn.sm{padding:5px 10px; font-size:12px;}
  .btn.icon-only{padding:7px 9px;}
  .btn:disabled{opacity:.35;}
  .row-actions{display:flex; gap:8px; flex-wrap:wrap;}

  .fab-row{display:flex; gap:10px; margin-bottom:16px;}

  .section-title{display:flex; align-items:center; gap:8px; margin:22px 0 10px;}
  .section-title .num{
    width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:ui-monospace,monospace;font-weight:700;font-size:12px;
  }
  .section-title h2{font-size:16px; margin:0;}

  .empty-state{
    border:2px dashed var(--line); border-radius:var(--radius); padding:28px 18px; text-align:center; color:var(--ink-soft);
    font-size:13px; line-height:1.7;
  }

  /* instruction banner */
  .info-banner{
    background:var(--card); border:1.5px solid var(--ink); border-radius:var(--radius); padding:12px 14px; margin-bottom:14px;
    font-size:12.5px; line-height:1.8; color:var(--ink);
  }
  .info-banner b{display:block; font-size:13px; margin-bottom:2px;}
  .info-banner ol{margin:4px 0 0; padding-left:18px;}

  /* GIFT LIST */
  .gift-card{
    background:var(--card); border:2px solid var(--ink); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:10px; display:flex; align-items:center; gap:12px;
  }
  .gift-card .g-type{
    font-family:ui-monospace,monospace; font-size:10px; padding:3px 9px; border-radius:999px; white-space:nowrap; font-weight:700;
  }
  .g-type.trade{background:var(--ink); color:#fff;}
  .g-type.give{background:#fff; color:var(--ink); border:1.5px solid var(--ink);}
  .gift-card .g-main{flex:1; min-width:0;}
  .gift-card .g-name{font-weight:700; font-size:15px; margin-bottom:3px; word-break:break-word;}
  .qty-stepper{display:flex; align-items:center; gap:8px; border:1.5px solid var(--ink); border-radius:999px; padding:2px;}
  .qty-stepper button{width:24px;height:24px;border-radius:50%;border:none;background:var(--ink);color:var(--paper);font-size:14px;line-height:1;cursor:pointer;}
  .qty-stepper span{font-family:ui-monospace,monospace; font-weight:700; min-width:20px; text-align:center; font-size:13px;}
  .g-del{background:none;border:none;color:var(--ink-soft);font-size:16px;cursor:pointer;padding:4px;}

  /* CATEGORY / ITEMS */
  .category-block{margin-bottom:18px;}
  .category-head{
    display:flex; align-items:center; gap:8px; padding:8px 4px; border-bottom:2px solid var(--ink); margin-bottom:8px;
  }
  .category-head .c-name{font-weight:700; font-size:15px; flex:1; word-break:break-word;}
  .category-head .c-count{font-family:ui-monospace,monospace; font-size:11px; color:var(--ink-soft);}
  .order-btns{display:flex; flex-direction:column;}
  .order-btns button{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:11px;line-height:1;padding:1px 3px;}
  .cat-menu-btn{background:none;border:none;color:var(--ink-soft);font-size:16px;cursor:pointer;padding:2px 4px;}

  .item-card{
    background:var(--card); border:1.5px solid var(--line); border-radius:var(--radius); margin-bottom:9px; overflow:hidden;
  }
  .item-row{display:flex; gap:10px; padding:10px; cursor:pointer;}
  .item-thumb{
    width:58px;height:58px;border-radius:10px;background:var(--paper-alt); flex-shrink:0; overflow:hidden;
    display:flex;align-items:center;justify-content:center; border:1px solid var(--line); font-size:20px; color:var(--ink-soft);
  }
  .item-thumb img{width:100%;height:100%;object-fit:cover;}
  .item-main{flex:1; min-width:0;}
  .item-top{display:flex; align-items:center; gap:6px; margin-bottom:2px;}
  .booth-badge{
    font-family:ui-monospace,monospace; font-weight:700; font-size:11px; background:var(--ink); color:var(--paper);
    padding:2px 7px; border-radius:5px; flex-shrink:0;
  }
  .vendor-name{font-size:12px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .item-name{font-weight:700; font-size:14.5px; margin:2px 0; word-break:break-word;}
  .item-price{font-family:ui-monospace,monospace; font-weight:700; font-size:13px; color:var(--ink);}
  .item-card.purchased .item-name{text-decoration:line-through; color:var(--ink-soft);}
  .item-card.purchased{opacity:.6;}
  .purchase-toggle{width:46px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .stamp-btn{
    width:40px;height:40px;border-radius:50%; border:2.5px solid var(--line); background:none; cursor:pointer;
    display:flex;align-items:center;justify-content:center; font-size:16px; color:var(--line); position:relative;
  }
  .stamp-btn.done{border-color:var(--ink); color:#fff; background:var(--ink); animation:stampPress .28s ease;}
  @keyframes stampPress{0%{transform:scale(1.5); opacity:0;} 60%{transform:scale(.9); opacity:1;} 100%{transform:scale(1);}}

  .item-detail{padding:0 12px 12px; border-top:1px dashed var(--line); margin-top:2px;}
  .item-detail-row{padding-top:10px; font-size:12.5px; color:var(--ink-soft); display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .gift-tag{background:var(--paper-alt); border:1px solid var(--line); border-radius:999px; padding:2px 8px; font-size:11px;}
  .link-tag{color:var(--ink); text-decoration:underline; word-break:break-all;}

  /* lightbox */
  .lightbox{position:fixed; inset:0; background:rgba(20,20,20,.92); z-index:90; display:none; align-items:center; justify-content:center; padding:24px;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%; max-height:100%; border-radius:8px;}
  .lightbox .lb-close{position:absolute; top:22px; right:20px; background:#fff; border:none; width:36px;height:36px;border-radius:50%; font-size:18px; cursor:pointer;}

  /* MODAL / SHEET */
  .overlay{position:fixed; inset:0; background:rgba(20,20,20,.45); z-index:50; display:none; align-items:flex-end; justify-content:center;}
  .overlay.show{display:flex;}
  .sheet{
    background:var(--paper); width:100%; max-width:560px; max-height:88vh; overflow-y:auto;
    border-radius:20px 20px 0 0; border-top:3px solid var(--ink); padding:18px 18px calc(24px + var(--safe-b));
    animation:slideUp .22s ease;
  }
  @keyframes slideUp{from{transform:translateY(30px); opacity:0;} to{transform:none; opacity:1;}}
  .sheet h3{font-size:17px; margin:0 0 14px;}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:5px;}
  .field input[type=text], .field input[type=number], .field input[type=url], .field select, .field textarea{
    width:100%; padding:10px 11px; border:1.5px solid var(--line); border-radius:10px; background:var(--card);
    font-size:14px; color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:50px;}
  .checkrow{display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13.5px;}
  .checkrow input{width:17px;height:17px;}
  .seg{display:flex; gap:8px;}
  .seg button{flex:1; padding:9px; border-radius:10px; border:1.5px solid var(--line); background:var(--card); font-size:13px; font-weight:700; color:var(--ink-soft); cursor:pointer;}
  .seg button.sel{border-color:var(--ink); color:#fff; background:var(--ink);}
  .sheet-actions{display:flex; gap:10px; margin-top:16px;}
  .sheet-actions .btn{flex:1; justify-content:center;}
  .img-preview{width:100%; height:120px; border-radius:10px; border:1.5px dashed var(--line); margin-top:8px; overflow:hidden; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:12px; background:var(--paper-alt);}
  .img-preview img{width:100%;height:100%;object-fit:cover;}

  /* MAP */
  .map-toolbar{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
  .map-search{display:flex; gap:8px; margin-bottom:12px;}
  .map-search input{flex:1; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line); font-family:ui-monospace,monospace; font-size:14px;}
  .map-wrap{
    border:2px solid var(--ink); border-radius:var(--radius); overflow:auto; height:56vh; position:relative; background:var(--card);
    -webkit-overflow-scrolling:touch;
  }
  .map-inner{position:relative; width:1200px; transform-origin: 0 0;}
  .map-inner img{width:100%; display:block; user-select:none; -webkit-user-drag:none;}
  .map-pin{
    position:absolute; width:30px;height:30px; margin-left:-15px; margin-top:-15px; border-radius:50%;
    background:var(--ink); border:2px solid #fff; color:#fff; font-family:ui-monospace,monospace; font-weight:700; font-size:10px;
    display:flex;align-items:center;justify-content:center; box-shadow:0 2px 4px rgba(0,0,0,.3); cursor:pointer;
  }
  .map-pin.highlight{animation:pinPulse 1.4s ease 2;}
  @keyframes pinPulse{0%{box-shadow:0 0 0 0 rgba(20,20,20,.6);}70%{box-shadow:0 0 0 16px rgba(20,20,20,0);}100%{box-shadow:0 0 0 0 rgba(20,20,20,0);}}
  .map-empty{padding:40px 20px; text-align:center;}
  .zoom-controls{display:flex; gap:6px;}

  .map-list-block{margin-top:18px;}
  .map-list-item{
    display:flex; align-items:center; gap:10px; background:var(--card); border:1.5px solid var(--line); border-radius:12px;
    padding:9px 12px; margin-bottom:8px; cursor:pointer;
  }
  .map-list-item .mli-status{width:8px;height:8px;border-radius:50%; background:var(--line); flex-shrink:0;}
  .map-list-item.done .mli-status{background:var(--ink);}
  .map-list-item .mli-main{flex:1; min-width:0;}
  .map-list-item .mli-name{font-weight:700; font-size:13.5px; word-break:break-word;}
  .map-list-item .mli-name.done{text-decoration:line-through; color:var(--ink-soft);}
  .map-list-item .mli-sub{font-size:11.5px; color:var(--ink-soft);}
  .map-list-item .mli-arrow{color:var(--ink-soft); font-size:16px;}
  .no-pin-tag{font-size:10px; color:var(--ink-soft); border:1px solid var(--line); border-radius:6px; padding:1px 5px;}

  .toast{
    position:fixed; bottom:calc(88px + var(--safe-b)); left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:9px 18px; border-radius:999px; font-size:13px; z-index:80;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .toast.show{opacity:1;}

  .hint{font-size:11.5px; color:var(--ink-soft); margin-top:4px; line-height:1.5;}
  .save-indicator{font-size:10.5px; color:var(--ink-soft); margin-left:auto; font-family:ui-monospace,monospace;}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div style="display:flex; align-items:center;">
      <div>
        <div class="eyebrow" id="tab-eyebrow">01</div>
        <h1 id="tab-title">禮物準備清單</h1>
      </div>
      <span class="save-indicator" id="save-indicator"></span>
    </div>
    <div class="sub" id="tab-sub">整理要帶去交換或贈送的小卡、周邊</div>
  </header>

  <main>
    <section class="tab-panel active" id="panel-gifts">
      <div class="fab-row">
        <button class="btn primary" onclick="openGiftForm()">＋ 新增物品</button>
      </div>
      <div id="gift-list"></div>
    </section>

    <section class="tab-panel" id="panel-shop">
      <div class="fab-row">
        <button class="btn primary" onclick="openItemForm()">＋ 新增商品</button>
        <button class="btn" onclick="openCategoryForm()">＋ 新增分類</button>
      </div>
      <div id="category-list"></div>
    </section>

    <section class="tab-panel" id="panel-map">
      <div id="map-content"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="active" data-tab="gifts" onclick="switchTab('gifts')">
      <span class="badge-num mono">01</span><span class="ic">&#127873;</span><span>禮物準備</span>
    </button>
    <button data-tab="shop" onclick="switchTab('shop')">
      <span class="badge-num mono">02</span><span class="ic">&#128220;</span><span>購物清單</span>
    </button>
    <button data-tab="map" onclick="switchTab('map')">
      <span class="badge-num mono">03</span><span class="ic">&#128506;</span><span>攤位地圖</span>
    </button>
  </nav>
</div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lb-close" onclick="event.stopPropagation(); closeLightbox()">&#10005;</button>
  <img id="lightbox-img" src="">
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- STATE ---------------- */
let gifts = [];
let shoppingData = { categories: [{id:'default', name:'未分類'}], items: [] };
let mapData = { image:null, pins:[] };
let currentTab = 'gifts';
let mapZoom = 1;
let addPinMode = false;
let expandedItemId = null;

const LS_KEYS = { gifts:'ff-gifts', shopping:'ff-shopping-data', map:'ff-map-data' };

/* ---------------- STORAGE (100% local, works offline) ---------------- */
function loadAll(){
  try{ const g = localStorage.getItem(LS_KEYS.gifts); if(g) gifts = JSON.parse(g); }catch(e){}
  try{ const s = localStorage.getItem(LS_KEYS.shopping); if(s) shoppingData = JSON.parse(s); }catch(e){}
  try{ const m = localStorage.getItem(LS_KEYS.map); if(m) mapData = JSON.parse(m); }catch(e){}
  renderAll();
}
function flashSaved(){
  const el = document.getElementById('save-indicator');
  el.textContent = '已自動儲存';
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.textContent=''; }, 1400);
}
function saveGifts(){
  try{ localStorage.setItem(LS_KEYS.gifts, JSON.stringify(gifts)); flashSaved(); }
  catch(e){ showToast('儲存空間不足，請刪除一些圖片'); }
}
function saveShopping(){
  try{ localStorage.setItem(LS_KEYS.shopping, JSON.stringify(shoppingData)); flashSaved(); }
  catch(e){ showToast('儲存空間不足，請刪除一些圖片'); }
}
function saveMap(){
  try{ localStorage.setItem(LS_KEYS.map, JSON.stringify(mapData)); flashSaved(); }
  catch(e){ showToast('儲存空間不足，地圖圖片可能太大'); }
}

/* ---------------- UTIL ---------------- */
function uid(){ return 'id-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 1800);
}
function esc(str){
  return (str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function compressImage(file, maxW, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------- TAB SWITCH ---------------- */
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
  document.querySelectorAll('nav.tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  const meta = {
    gifts:['01','禮物準備清單','整理要帶去交換或贈送的小卡、周邊'],
    shop:['02','購物清單','攤位、商品、預算，一次管理'],
    map:['03','攤位地圖','輸入攤位號，直接跳到定位']
  }[tab];
  document.getElementById('tab-eyebrow').textContent = meta[0];
  document.getElementById('tab-title').textContent = meta[1];
  document.getElementById('tab-sub').textContent = meta[2];
  if(tab==='map') renderMap();
}

function renderAll(){ renderGifts(); renderShopping(); renderMap(); }

/* ================= TAB 1: GIFTS ================= */
function renderGifts(){
  const wrap = document.getElementById('gift-list');
  if(gifts.length===0){
    wrap.innerHTML = '<div class="empty-state">還沒有準備清單喔<br>點上方「＋ 新增物品」開始記錄要帶去交換或贈送的小卡 / 周邊</div>';
    return;
  }
  wrap.innerHTML = gifts.map(g=>`
    <div class="gift-card">
      <span class="g-type ${g.type==='trade'?'trade':'give'}">${g.type==='trade'?'交換用':'贈送用'}</span>
      <div class="g-main">
        <div class="g-name">${esc(g.name)}</div>
        <div class="qty-stepper">
          <button onclick="changeGiftQty('${g.id}',-1)">－</button>
          <span>${g.qty}</span>
          <button onclick="changeGiftQty('${g.id}',1)">＋</button>
        </div>
      </div>
      <button class="g-del" onclick="deleteGift('${g.id}')">&#128465;</button>
    </div>
  `).join('');
}
function changeGiftQty(id, delta){
  const g = gifts.find(x=>x.id===id); if(!g) return;
  g.qty = Math.max(0, g.qty+delta);
  saveGifts(); renderGifts();
}
function deleteGift(id){
  gifts = gifts.filter(x=>x.id!==id);
  saveGifts(); renderGifts(); renderShopping();
}
function openGiftForm(){
  openSheet('新增準備物品', `
    <div class="field"><label>物品名稱</label><input type="text" id="f-gname" placeholder="例：自製透卡 / OC徽章"></div>
    <div class="field"><label>數量</label><input type="number" id="f-gqty" value="1" min="0"></div>
    <div class="field"><label>用途</label>
      <div class="seg">
        <button type="button" class="sel" data-val="trade" onclick="pickSeg(this)">交換用</button>
        <button type="button" data-val="give" onclick="pickSeg(this)">贈送用</button>
      </div>
    </div>
  `, ()=>{
    const name = document.getElementById('f-gname').value.trim();
    if(!name){ showToast('請輸入物品名稱'); return false; }
    const qty = parseInt(document.getElementById('f-gqty').value)||0;
    const type = document.querySelector('.seg button.sel').dataset.val;
    gifts.push({id:uid(), name, qty, type});
    saveGifts(); renderGifts();
    return true;
  });
}
function pickSeg(btn){
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
}

/* ================= TAB 2: SHOPPING LIST ================= */
function renderShopping(){
  const wrap = document.getElementById('category-list');
  if(shoppingData.categories.length===0){
    wrap.innerHTML = '<div class="empty-state">先新增一個分類（例如：作品名稱 / 純購買 / 純交換）</div>';
    return;
  }
  wrap.innerHTML = shoppingData.categories.map((cat, idx)=>{
    const items = shoppingData.items.filter(i=>i.categoryId===cat.id);
    return `
    <div class="category-block">
      <div class="category-head">
        <div class="order-btns">
          <button ${idx===0?'disabled':''} onclick="moveCategory('${cat.id}',-1)">&#9650;</button>
          <button ${idx===shoppingData.categories.length-1?'disabled':''} onclick="moveCategory('${cat.id}',1)">&#9660;</button>
        </div>
        <div class="c-name">${esc(cat.name)}</div>
        <div class="c-count mono">${items.filter(i=>i.purchased).length}/${items.length}</div>
        <button class="cat-menu-btn" onclick="openCategoryForm('${cat.id}')">&#9998;</button>
        <button class="cat-menu-btn" onclick="deleteCategory('${cat.id}')">&#128465;</button>
      </div>
      ${items.length===0
        ? '<div class="empty-state" style="padding:16px;">這個分類還沒有商品</div>'
        : items.map(it=>renderItemCard(it)).join('')}
    </div>`;
  }).join('');
}

function renderItemCard(it){
  const expanded = expandedItemId===it.id;
  const linkedGifts = (it.giftIds||[]).map(gid=>gifts.find(g=>g.id===gid)).filter(Boolean);
  return `
  <div class="item-card ${it.purchased?'purchased':''}">
    <div class="item-row" onclick="toggleExpand('${it.id}')">
      <div class="item-thumb" ${it.image?`onclick="event.stopPropagation(); openLightbox('${it.image}')"`:''}>${it.image ? `<img src="${it.image}">` : '&#128717;'}</div>
      <div class="item-main">
        <div class="item-top">
          <span class="booth-badge mono">${esc(it.booth||'--')}</span>
          <span class="vendor-name">${esc(it.vendor||'')}</span>
        </div>
        <div class="item-name">${esc(it.name||'（未命名商品）')}</div>
        <div class="item-price mono">${it.price ? '$'+it.price : ''}</div>
      </div>
      <div class="purchase-toggle">
        <button class="stamp-btn ${it.purchased?'done':''}" onclick="event.stopPropagation(); togglePurchased('${it.id}')">${it.purchased?'&#10003;':''}</button>
      </div>
    </div>
    ${expanded ? `
      <div class="item-detail">
        <div class="item-detail-row">
          ${it.url ? `<a class="link-tag" href="${esc(it.url)}" target="_blank" rel="noopener">&#128279; 商品連結</a>` : '<span>無商品連結</span>'}
        </div>
        ${linkedGifts.length ? `<div class="item-detail-row">&#127873; 攜帶：${linkedGifts.map(g=>`<span class="gift-tag">${esc(g.name)} &times;${g.qty}</span>`).join('')}</div>` : ''}
        <div class="row-actions" style="margin-top:10px;">
          <button class="btn ghost sm" onclick="event.stopPropagation(); openItemForm('${it.id}')">編輯</button>
          <button class="btn ghost sm" onclick="event.stopPropagation(); deleteItem('${it.id}')">刪除</button>
        </div>
      </div>` : ''}
  </div>`;
}
function toggleExpand(id){
  expandedItemId = expandedItemId===id ? null : id;
  renderShopping();
}
function togglePurchased(id){
  const it = shoppingData.items.find(x=>x.id===id); if(!it) return;
  it.purchased = !it.purchased;
  saveShopping(); renderShopping();
  if(currentTab==='map') renderMap();
}
function deleteItem(id){
  shoppingData.items = shoppingData.items.filter(x=>x.id!==id);
  saveShopping(); renderShopping();
}
function moveCategory(id, dir){
  const arr = shoppingData.categories;
  const i = arr.findIndex(c=>c.id===id);
  const j = i+dir;
  if(j<0||j>=arr.length) return;
  const tmp = arr[i]; arr[i]=arr[j]; arr[j]=tmp;
  saveShopping(); renderShopping();
}
function deleteCategory(id){
  if(shoppingData.categories.length===1){ showToast('至少要保留一個分類'); return; }
  const fallback = shoppingData.categories.find(c=>c.id!==id).id;
  shoppingData.items.forEach(it=>{ if(it.categoryId===id) it.categoryId = fallback; });
  shoppingData.categories = shoppingData.categories.filter(c=>c.id!==id);
  saveShopping(); renderShopping();
}
function openCategoryForm(editId){
  const editing = editId ? shoppingData.categories.find(c=>c.id===editId) : null;
  openSheet(editing?'編輯分類':'新增分類', `
    <div class="field"><label>分類名稱</label><input type="text" id="f-catname" placeholder="例：進擊的巨人 / 純購買" value="${editing?esc(editing.name):''}"></div>
  `, ()=>{
    const name = document.getElementById('f-catname').value.trim();
    if(!name){ showToast('請輸入分類名稱'); return false; }
    if(editing){ editing.name = name; }
    else{ shoppingData.categories.push({id:uid(), name}); }
    saveShopping(); renderShopping();
    return true;
  });
}

function openItemForm(editId){
  const editing = editId ? shoppingData.items.find(x=>x.id===editId) : null;
  const catOptions = shoppingData.categories.map(c=>`<option value="${c.id}" ${editing&&editing.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
  const giftChecks = gifts.length===0
    ? '<div class="hint">尚未新增禮物，先到「禮物準備」頁新增交換 / 贈送物品</div>'
    : gifts.map(g=>`
      <label class="checkrow">
        <input type="checkbox" value="${g.id}" ${editing&&(editing.giftIds||[]).includes(g.id)?'checked':''} class="gift-check">
        ${esc(g.name)} <span class="hint">(${g.type==='trade'?'交換':'贈送'}, 共${g.qty})</span>
      </label>`).join('');

  openSheet(editing?'編輯商品':'新增商品', `
    <div class="field"><label>分類</label><select id="f-cat">${catOptions}</select></div>
    <div class="field"><label>攤位號碼</label><input type="text" id="f-booth" placeholder="例：A12" value="${editing?esc(editing.booth||''):''}"></div>
    <div class="field"><label>攤主名稱</label><input type="text" id="f-vendor" placeholder="社團 / 攤主名" value="${editing?esc(editing.vendor||''):''}"></div>
    <div class="field"><label>商品名稱</label><input type="text" id="f-iname" placeholder="商品名稱" value="${editing?esc(editing.name||''):''}"></div>
    <div class="field"><label>金額</label><input type="number" id="f-price" placeholder="0" value="${editing?editing.price||'':''}"></div>
    <div class="field"><label>商品網址（選填）</label><input type="url" id="f-url" placeholder="https://" value="${editing?esc(editing.url||''):''}"></div>
    <div class="field">
      <label>商品圖片（選填）</label>
      <input type="file" accept="image/*" id="f-imgfile" onchange="previewItemImage(event)">
      <input type="url" id="f-imgurl" placeholder="或貼上圖片網址" value="${editing&&editing.image&&editing.image.startsWith('http')?esc(editing.image):''}" style="margin-top:6px;" oninput="document.getElementById('f-imgdata').value=''; renderImgPreview(this.value)">
      <input type="hidden" id="f-imgdata" value="${editing&&editing.image&&editing.image.startsWith('data:')?editing.image:''}">
      <div class="img-preview" id="img-preview-box">${editing&&editing.image?`<img src="${editing.image}">`:'尚無圖片'}</div>
    </div>
    <div class="field"><label>攜帶的禮物 / 交換物（選填）</label>${giftChecks}</div>
  `, ()=>{
    const name = document.getElementById('f-iname').value.trim();
    if(!name){ showToast('請輸入商品名稱'); return false; }
    const imgData = document.getElementById('f-imgdata').value;
    const imgUrl = document.getElementById('f-imgurl').value.trim();
    const giftIds = Array.from(document.querySelectorAll('.gift-check:checked')).map(c=>c.value);
    const payload = {
      categoryId: document.getElementById('f-cat').value,
      booth: document.getElementById('f-booth').value.trim(),
      vendor: document.getElementById('f-vendor').value.trim(),
      name,
      price: document.getElementById('f-price').value,
      url: document.getElementById('f-url').value.trim(),
      image: imgData || imgUrl || null,
      giftIds
    };
    if(editing){ Object.assign(editing, payload); }
    else{ shoppingData.items.push({id:uid(), purchased:false, ...payload}); }
    saveShopping(); renderShopping();
    if(currentTab==='map') renderMap();
    return true;
  });
}
async function previewItemImage(e){
  const file = e.target.files[0]; if(!file) return;
  showToast('圖片處理中…');
  try{
    const dataUrl = await compressImage(file, 400, 0.6);
    document.getElementById('f-imgdata').value = dataUrl;
    document.getElementById('f-imgurl').value = '';
    renderImgPreview(dataUrl);
  }catch(err){ showToast('圖片讀取失敗'); }
}
function renderImgPreview(src){
  const box = document.getElementById('img-preview-box');
  box.innerHTML = src ? `<img src="${src}">` : '尚無圖片';
}

/* ---- lightbox (image zoom) ---- */
function openLightbox(src){
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('show');
}

/* ================= TAB 3: MAP ================= */
function renderMap(){
  const wrap = document.getElementById('map-content');
  if(!mapData.image){
    wrap.innerHTML = `
      <div class="empty-state map-empty">
        還沒有上傳地圖圖片<br><br>
        <label class="btn primary" style="cursor:pointer;">
          ＋ 上傳會場地圖
          <input type="file" accept="image/*" style="display:none" onchange="uploadMapImage(event)">
        </label>
      </div>`;
    return;
  }

  const boothItems = shoppingData.items.filter(it=>it.booth && it.booth.trim());
  const pinBooths = new Set(mapData.pins.map(p=>p.booth.toLowerCase()));

  wrap.innerHTML = `
    <div class="info-banner">
      <b>如何在地圖上定位攤位</b>
      <ol>
        <li>點下方「＋ 新增攤位標記」開啟標記模式</li>
        <li>在地圖上直接點攤位所在的位置</li>
        <li>輸入攤位號碼即完成，之後可用搜尋或下方清單快速跳轉</li>
      </ol>
    </div>
    <div class="map-search">
      <input type="text" id="map-search-input" placeholder="輸入攤位號碼，例如 A12" onkeydown="if(event.key==='Enter') jumpToBooth()">
      <button class="btn primary" onclick="jumpToBooth()">跳至定位</button>
    </div>
    <div class="map-toolbar">
      <button class="btn sm ${addPinMode?'primary':''}" onclick="toggleAddPin()">${addPinMode?'✓ 點地圖新增標記':'＋ 新增攤位標記'}</button>
      <div class="zoom-controls">
        <button class="btn sm icon-only" onclick="changeZoom(-0.25)">－</button>
        <button class="btn sm icon-only" onclick="changeZoom(0.25)">＋</button>
      </div>
      <label class="btn sm ghost" style="cursor:pointer;">更換地圖
        <input type="file" accept="image/*" style="display:none" onchange="uploadMapImage(event)">
      </label>
    </div>
    <div class="map-wrap" id="map-wrap">
      <div class="map-inner" id="map-inner" style="transform:scale(${mapZoom});">
        <img src="${mapData.image}" id="map-img" onclick="handleMapClick(event)">
        ${mapData.pins.map(p=>`
          <div class="map-pin mono" id="pin-${p.id}" style="left:${p.x}%; top:${p.y}%;" onclick="event.stopPropagation(); editPin('${p.id}')">${esc(p.booth)}</div>
        `).join('')}
      </div>
    </div>

    <div class="map-list-block">
      <div class="section-title"><div class="num mono">02</div><h2>購物清單定位</h2></div>
      ${boothItems.length===0 ? '<div class="empty-state">購物清單裡還沒有填攤位號碼的商品</div>' :
        boothItems.map(it=>{
          const hasPin = pinBooths.has((it.booth||'').toLowerCase());
          return `
          <div class="map-list-item ${it.purchased?'done':''}" onclick="jumpFromList('${it.booth.replace(/'/g,"\\'")}')">
            <div class="mli-status"></div>
            <span class="booth-badge mono">${esc(it.booth)}</span>
            <div class="mli-main">
              <div class="mli-name ${it.purchased?'done':''}">${esc(it.name||'（未命名商品）')}</div>
              <div class="mli-sub">${esc(it.vendor||'')}</div>
            </div>
            ${hasPin ? '<span class="mli-arrow">&#8594;</span>' : '<span class="no-pin-tag">尚未標記</span>'}
          </div>`;
        }).join('')
      }
    </div>
  `;
}
async function uploadMapImage(e){
  const file = e.target.files[0]; if(!file) return;
  showToast('地圖處理中…');
  try{
    const dataUrl = await compressImage(file, 1600, 0.75);
    mapData.image = dataUrl;
    mapZoom = 1;
    addPinMode = true;
    saveMap(); renderMap();
    showToast('地圖上傳成功！點地圖上的位置新增攤位標記');
  }catch(err){ showToast('圖片讀取失敗'); }
}
function toggleAddPin(){
  addPinMode = !addPinMode;
  renderMap();
}
function handleMapClick(e){
  if(!addPinMode) return;
  const img = document.getElementById('map-img');
  const rect = img.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * 100;
  const y = ((e.clientY - rect.top) / rect.height) * 100;
  const booth = prompt('這個位置的攤位號碼是？');
  if(!booth) return;
  mapData.pins.push({id:uid(), booth:booth.trim(), x, y});
  saveMap(); renderMap();
}
function editPin(id){
  const pin = mapData.pins.find(p=>p.id===id); if(!pin) return;
  const action = confirm(`攤位「${pin.booth}」\n\n按「確定」修改攤位號碼，按「取消」則可選擇刪除。`);
  if(action){
    const newBooth = prompt('修改攤位號碼：', pin.booth);
    if(newBooth){ pin.booth = newBooth.trim(); saveMap(); renderMap(); }
  }else{
    if(confirm('要刪除這個標記嗎？')){
      mapData.pins = mapData.pins.filter(p=>p.id!==id);
      saveMap(); renderMap();
    }
  }
}
function changeZoom(delta){
  mapZoom = Math.min(3, Math.max(0.5, +(mapZoom+delta).toFixed(2)));
  const inner = document.getElementById('map-inner');
  if(inner) inner.style.transform = `scale(${mapZoom})`;
}
function jumpToBooth(){
  const q = document.getElementById('map-search-input').value.trim();
  if(!q) return;
  jumpToBoothValue(q);
}
function jumpFromList(booth){
  const input = document.getElementById('map-search-input');
  if(input) input.value = booth;
  jumpToBoothValue(booth);
}
function jumpToBoothValue(q){
  const pin = mapData.pins.find(p=>p.booth.toLowerCase()===q.toLowerCase());
  if(!pin){ showToast('此攤位尚未在地圖上標記，請先新增標記'); return; }
  const wrap = document.getElementById('map-wrap');
  const inner = document.getElementById('map-inner');
  if(!wrap || !inner) return;
  const baseW = 1200;
  const targetX = (pin.x/100)*baseW*mapZoom;
  const targetY = (pin.y/100)*(inner.offsetHeight/mapZoom)*mapZoom;
  wrap.scrollTo({
    left: targetX - wrap.clientWidth/2,
    top: targetY - wrap.clientHeight/2,
    behavior:'smooth'
  });
  const pinEl = document.getElementById('pin-'+pin.id);
  if(pinEl){
    pinEl.classList.add('highlight');
    setTimeout(()=>pinEl.classList.remove('highlight'), 2800);
  }
}

/* ================= SHEET / MODAL ================= */
function openSheet(title, bodyHtml, onSubmit){
  const overlay = document.getElementById('overlay');
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = `
    <h3>${esc(title)}</h3>
    ${bodyHtml}
    <div class="sheet-actions">
      <button class="btn ghost" onclick="closeSheet()">取消</button>
      <button class="btn primary" id="sheet-submit">儲存</button>
    </div>
  `;
  document.getElementById('sheet-submit').onclick = ()=>{
    const ok = onSubmit();
    if(ok!==false) closeSheet();
  };
  overlay.classList.add('show');
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('show');
}
document.getElementById('overlay').addEventListener('click', e=>{
  if(e.target.id==='overlay') closeSheet();
});

/* ---------------- INIT ---------------- */
loadAll();
</script>
